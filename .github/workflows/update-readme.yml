name: Update README

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "bin/**"
      - "go/**"
      - "scripts/generate_readme.py"
      - ".github/workflows/update-readme.yml"

      # Remove zsh from list
      # - "bin_SHELL/**"
      # - "zsh/**"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan repository and regenerate README
        run: python3 scripts/generate_readme.py

      - name: Commit and push if README changed
        run: |
          if git diff --quiet README.md; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m 'docs: update README from repository scan' -m 'Automated inventory refresh of scripts, binaries, and configuration files.'
          git push
